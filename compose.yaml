name: hearth-ui-docs

services:
  docs:
    image: hearth-ui-docs:local
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8187:8080"
    networks:
      default:
      proxy:
        aliases: [hearth-ui-web]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/llms.txt"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

networks:
  proxy:
    external: true
    name: traefik-proxy
